
apiVersion: apps/v1                   # Kubernetes Deployment API
kind: Deployment                      # Resource type
metadata:
  name: nginx-production              # Deployment name
  namespace: production                # Namespace must already exist
  labels:
    app: nginx                         # Standard application label

spec:
  replicas: 3                         # Run 3 Pod replicas
  revisionHistoryLimit: 5             # Keep 5 old ReplicaSets
  progressDeadlineSeconds: 600        # Deployment progress timeout

  strategy:
    type: RollingUpdate                # Update gradually
    rollingUpdate:
      maxSurge: 1                     # Allow 1 extra Pod during updates
      maxUnavailable: 0               # Keep desired replicas available

  selector:
    matchLabels:
      app: nginx                      # Must match template labels
 
  template:
    metadata:
      labels:
        app: nginx                    # Label applied to every Pod

    spec:
      automountServiceAccountToken: false # Don't mount API token unnecessarily
      terminationGracePeriodSeconds: 30   # Allow graceful shutdown

      securityContext:
        runAsNonRoot: true             # Do not run as root
        runAsUser: 101                 # Non-root UID for this image
                  
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:stable
          # Production: pin an approved image digest instead of a mutable tag

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080      # Unprivileged NGINX listens on 8080

          resources:
            requests:
              cpu: 100m                # Reserve 0.1 CPU
              memory: 128Mi            # Request 128 MiB memory
            limits:
              cpu: 500m                # Maximum 0.5 CPU
              memory: 256Mi            # Maximum 256 MiB memory

          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 30       # Allow time for startup

          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3        # Mark unready after failures

          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3        # Restart if health checks keep failing

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL                 # Remove Linux capabilities
